apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
   replicas: 1 
   selector:
     matchLabels: 
       app: postgres
   template:
     metadata:
        labels:
          app: postgres
     spec:
        containers:
          - name: postgres
            image: postgres:14
            env:
              - name: POSTGRES_DB
                value: CatalogDb
              - name: POSTGRES_USER
                value: postgres
              - name: POSTGRES_PASSWORD
                value: postgres
            ports:
              - containerPort: 5432
      # Readiness Probe
            readinessProbe:
               tcpSocket:
                  port: 5432
               initialDelaySeconds: 5
               periodSeconds: 5
            livenessProbe:
               tcpSocket:
                  port: 5432
               initialDelaySeconds: 10
               periodSeconds: 10   
       

---
apiVersion: v1
kind: Service
metadata: 
    name: postgres
spec:
  selector: 
     app: postgres
     #port: 5432
     #app: postgres

  ports: 
    - port: 5432
      targetPort: 5432
   
